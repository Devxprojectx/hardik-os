name: Build HARDIK OS ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", ".github/workflows/build-iso.yml", "README.md", "docs/**"]
permissions:
  contents: read
concurrency:
  group: hardik-os-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate repository scripts and configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/validate-debian-config.sh
          echo "Host-side source validation passed."
      - name: Build and verify inside a privileged Debian Trixie builder
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            debian:trixie bash -Eeuo pipefail -c '
              set -euxo pipefail
              rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
              cat > /etc/apt/sources.list.d/hardik-debian.sources <<EOF
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates trixie-backports
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://security.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                bash ca-certificates git live-build debootstrap xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools isolinux syslinux-common \
                rsync curl wget file python3 debian-archive-keyring librsvg2-bin qemu-system-x86
              git config --global --add safe.directory /workspace
              bash scripts/validate-debian-config.sh
              mapfile -t packages < <(grep -Ev "^[[:space:]]*(#|$)" config/package-lists/hardik.list.chroot)
              test "${#packages[@]}" -gt 0
              apt-get install --simulate --no-install-recommends -t trixie-backports "${packages[@]}" | tee /tmp/hardik-package-plan.txt
              dpkg --add-architecture i386
              apt-get update
              apt-get install --simulate wine32:i386 | tee /tmp/hardik-wine32-plan.txt
              bash scripts/build-iso.sh
              test -s output/hardik-os-0.8.1-amd64.iso
              file output/hardik-os-0.8.1-amd64.iso
              xorriso -indev output/hardik-os-0.8.1-amd64.iso -report_el_torito as_mkisofs
              xorriso -indev output/hardik-os-0.8.1-amd64.iso -find / -name filesystem.squashfs | tee /tmp/hardik-squashfs-check.txt
              grep -q "filesystem.squashfs" /tmp/hardik-squashfs-check.txt
              xorriso -indev output/hardik-os-0.8.1-amd64.iso -find / -name vmlinuz | tee /tmp/hardik-kernel-check.txt
              grep -q "vmlinuz" /tmp/hardik-kernel-check.txt
              xorriso -indev output/hardik-os-0.8.1-amd64.iso -find / -name initrd.img | tee /tmp/hardik-initrd-check.txt
              grep -q "initrd.img" /tmp/hardik-initrd-check.txt
              echo "ISO contains live kernel, initramfs, and root filesystem."
              mkdir -p /mnt/hardik-iso
              mount -o loop,ro output/hardik-os-0.8.1-amd64.iso /mnt/hardik-iso
              trap "umount /mnt/hardik-iso 2>/dev/null || true" EXIT
              test -s /mnt/hardik-iso/live/filesystem.squashfs
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs etc/calamares/settings.conf > /tmp/hardik-calamares-settings.conf
              grep -q "branding: hardik" /tmp/hardik-calamares-settings.conf
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs usr/local/bin/hardik-installer > /tmp/hardik-installer-launcher
              grep -q "pkexec /usr/bin/calamares" /tmp/hardik-installer-launcher
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs usr/share/applications/hardik-installer.desktop > /tmp/hardik-installer.desktop
              grep -q "Name=Install HARDIK OS" /tmp/hardik-installer.desktop
              grep -q "Exec=hardik-installer" /tmp/hardik-installer.desktop
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs usr/share/wayland-sessions/plasma.desktop > /tmp/hardik-wayland-session.desktop
              grep -q "startplasma-wayland" /tmp/hardik-wayland-session.desktop
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs etc/sddm.conf.d/10-hardik-live.conf > /tmp/hardik-sddm-live.conf
              grep -q "Session=plasmax11.desktop" /tmp/hardik-sddm-live.conf
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs usr/share/xsessions/plasmax11.desktop > /tmp/hardik-x11-session.desktop
              grep -q "startplasma-x11" /tmp/hardik-x11-session.desktop
              unsquashfs -ll /mnt/hardik-iso/live/filesystem.squashfs > /tmp/hardik-squashfs-files.txt
              grep -q "polkit-kde-authentication-agent-1" /tmp/hardik-squashfs-files.txt
              grep -q "hardik-wallpaper.png" /tmp/hardik-squashfs-files.txt
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs usr/local/bin/hardik-open-package > /tmp/hardik-package-handler.sh
              grep -q "command -v 7zz" /tmp/hardik-package-handler.sh
              grep -q "command -v 7z" /tmp/hardik-package-handler.sh
              echo "Verified Calamares configuration, branded launcher, Polkit agent, and wallpaper inside the ISO."
              # Confirm Waydroid cannot start during live boot (it can hold up graphical startup).
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs etc/systemd/system/waydroid-container.service.d/10-hardik-live.conf > /tmp/hardik-waydroid-live-guard.conf
              grep -q "ConditionKernelCommandLine=!boot=live" /tmp/hardik-waydroid-live-guard.conf
              unsquashfs -cat /mnt/hardik-iso/live/filesystem.squashfs etc/systemd/system/hardik-waydroid-firstboot.timer > /tmp/hardik-waydroid-timer.conf
              grep -q "OnBootSec=45s" /tmp/hardik-waydroid-timer.conf

              # Headless QEMU smoke test: boot the ISO's real kernel/initrd with the live ISO attached.
              # Serial console makes systemd's graphical target observable in CI.
              cp /mnt/hardik-iso/live/vmlinuz /tmp/hardik-vmlinuz
              cp /mnt/hardik-iso/live/initrd.img /tmp/hardik-initrd.img
              rm -f /tmp/hardik-qemu-boot.log
              qemu-system-x86_64 -accel tcg,thread=multi -m 4096 -smp 2 -vga std \
                -kernel /tmp/hardik-vmlinuz -initrd /tmp/hardik-initrd.img \
                -append "boot=live components username=hardik hostname=hardik-os console=ttyS0,115200n8 systemd.log_target=console systemd.log_level=info splash" \
                -drive file=/workspace/output/hardik-os-0.8.1-amd64.iso,media=cdrom,readonly=on,if=ide \
                -display none -serial file:/tmp/hardik-qemu-boot.log -monitor none -no-reboot &
              qemu_pid=$!
              boot_ok=0
              for attempt in $(seq 1 180); do
                if grep -q "Reached target graphical.target" /tmp/hardik-qemu-boot.log 2>/dev/null; then
                  boot_ok=1
                  break
                fi
                if ! kill -0 "$qemu_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" 2>/dev/null || true
              cat /tmp/hardik-qemu-boot.log
              test "$boot_ok" -eq 1 || { echo "QEMU failed to reach graphical.target; inspect boot log above." >&2; exit 1; }
              echo "Headless QEMU boot smoke test passed: graphical.target reached."
              umount /mnt/hardik-iso
              trap - EXIT
              sha256sum -c output/SHA256SUMS
            '
      - name: Upload verified ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hardik-os-0.8.1-iso
          path: |
            output/*.iso
            output/SHA256SUMS
            output/build-info.txt
            output/build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardik-os-build-diagnostics
          path: |
            output/build.log
            output/build-info.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
